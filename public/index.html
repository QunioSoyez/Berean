<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <meta
      name="description"
      content="Free Bible study app: read the KJV, WEB, ASV, YLT and the Spanish NTBT, highlight verses, bookmark, take notes and read Matthew Henry's commentary. No account needed."
    />
    <!-- Link previews (Facebook, Messenger, iMessage, X, LinkedIn…). Image: public/og-image.jpg -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Berean" />
    <meta property="og:title" content="Berean — Read, highlight and study the Bible" />
    <meta
      property="og:description"
      content="Free Bible study app with KJV, WEB, ASV, YLT and NTBT (Español), highlights, bookmarks, notes and commentary. No account needed."
    />
    <meta property="og:url" content="https://bereanbible.live/" />
    <meta property="og:image" content="https://bereanbible.live/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Berean logo — Read, highlight and study the Bible, free, at bereanbible.live" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Berean — Read, highlight and study the Bible" />
    <meta
      name="twitter:description"
      content="Free Bible study app with KJV, WEB, ASV, YLT and NTBT (Español), highlights, bookmarks, notes and commentary."
    />
    <meta name="twitter:image" content="https://bereanbible.live/og-image.jpg" />
    <!-- iPhone/iPad "Add to Home Screen": app icon, name and full-screen launch -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Berean" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#FFFFFF" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
